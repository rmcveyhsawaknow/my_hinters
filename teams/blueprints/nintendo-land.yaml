# Nintendo Land, as blocks (the owner's instruction of 2026-11-03): a large themed land for every team of the
# collective to build once its own works are done, inspired by the worlds of Nintendo's games and built in our own
# words and shapes (no logos, no quoted text; the names of places and things only).
#
# The site: the open north of the island, x 55-94, y 20-39, forty tiles by twenty on thirty-two lots (F02-NE,
# F02-SE, F03-NE, F03-SE, G02-*, G03-*, H02-*, H03-*, I02-*, I03-*, J02-NW, J02-SW, J03-NW, J03-SW), the ground the
# collective holds by contract with the land office (no `land` block: nothing waits on a deed). Read from the public
# world of tick 153228 (`hglab factory survey --x0 53 --y0 18 --x1 96 --y1 41`, runs/local/world.json): grass in the
# north and west, a band of sand from (73,31) south to the edge, forest in the south-west (x 66-73, y 33-39), the
# south-east (x 79-94, y 32-39) and the north-east corner; some two hundred wood, fiber and berry nodes scattered
# over it and no stone or ore node at all; no resident's building. The office's claim sign stands on every lot's
# centre tile (x 57, 62, ..., 92; y 22, 27, 32, 37): no block below level 6 stands on one, so every footprint keeps
# to the bands between them (x 58-61, 63-66, ... or y 23-26, 28-31, 33-36) unless it is a lawn whose slabs ring the
# sign or a treehouse whose deck passes over it. Lagalong's roads at (58,38), (63,28) and (70-71,37) and
# Sheafwell's walls at (68-69,39) stay as they are, clear of every step. Buildings keep a lane at least a tile wide
# between them and every door opens onto open ground; lawns, ponds, the pad and the circuit are slabs at level 0
# and leave the nodes under them open.
#
# Ten districts, west to east and north to south. North: the Mushroom Kingdom (the castle with its keep and
# turrets, the giant mushroom, the first course with its floating blocks, warp pipes, flagpole and goal fort), the
# Kart Circuit (a black loop with red and white bends, the start gantry over the south straight, the grandstand
# and the pit garage in the infield), Dream Land (Kirby's house and the Warp Star pond) and the Pokemon village
# (the healing centre, the gym, the professor's lab and the route pond). The middle: the History Walk of four
# small pavilions leading east to the Nintendo Museum at the heart, and Inkopolis (two bright towers and a plaza).
# South: the Animal Crossing village (Resident Services, the shop, the town square and the orchard), Hyrule's
# woods (the Lost Woods clearing with the blade in its stone, the Temple of Time, the Sage's Spire), the sands of
# planet Zebes (the landing pad with a gunship hovering on struts, a Chozo statue and the Chozo ruins) and the
# Donkey Kong jungle (two treehouses joined by rope bridges to the barrel tower, the old ape's cabin and the
# banana hoard). The tallest things stand at the ceiling: the castle's keep and turrets, the mushroom and the
# Sage's Spire; most buildings stand four to ten levels so the skyline rises and falls. No metal anywhere.
#
# Who builds it: every team, once its own works are done (the owner, 2026-11-03): the Chocolate Factory's crew
# after the factory, Lower Manhattan, Midtown and Central Park; the land office's hands once their walls stand and
# their stores are full; Neverland's builders after the Treetop Hideaway; Plumbline after the Atelier's replicas;
# the Admiralty and the commons as they like. Every box is at most 160 cells, so a pack with its berries aside pays
# for any step; the site lies far from every store, so builders carry each step's material there (`commute`).
# Tubes start on the ground or rest on a building, so `hglab factory check` finds every step supported in order.
# Buildings stand on surveyed plinths (`foundation`, from `hglab factory level --write`); the lawns, ponds, the pad
# and the treehouses keep none, since a plinth would close the tiles their slabs and decks leave open (strip their
# rows again if the survey is rerun; tests/test_nintendo_land.py checks it). Eighteen nodes lie under footprints
# (twelve fiber, five berry, one wood), none of them stone or ore; the other nodes of the site stay open.
#
# Tiles are [x0, y0, x1, y1], inclusive; cells are 4 per tile. Colours: natural white grey black brown red orange
# yellow lime green teal cyan blue indigo purple pink tan. Materials: wood (wood), stone (stone), thatch (fiber).
name: Nintendo Land
title: the Nintendo Land blueprint  # how a builder's reasons name it
team: commons  # the whole collective's: every team builds it after its own works (the field is informational)
plots: [F02, F03, G02, G03, H02, H03, I02, I03, J02, J03]  # only the east half of F and the west half of J are ours
version: 1
foundation_block: [stone, grey]
commute: true
story: >-
  A theme park of play on the island's open north, laid out as ten small worlds a visitor walks through: a pink
  castle under a mushroom as tall as the sky allows, a first course of floating blocks and green pipes, a racing
  loop with its grandstand, a pink house in a land of dreams, a village of healing centres and gyms, a walk of
  pavilions through a hundred and thirty years of games to the museum at the heart, a city of bright towers, an
  animal village round its square, the woods of a sword in stone and a temple of time, a gunship on desert sand,
  and a jungle of treehouses and barrels.
