# Model mix, chosen for cost: see docs/deploy-agent.md (cost math) and `hglab budget status`.
# Prices per million tokens (2026-10): Haiku 5.5 $0.10/$0.50, Sonnet 5.5 $2/$10, Opus 5.5 $4/$20.
routes:
  # Verification and registration challenges: small, must be right first time.
  challenge:
    provider: anthropic
    model: claude-sonnet-5-5
    effort: low
  # The cheapest vendor model for a daily verification (the fool's, 2026-10-24): the 25-second deadline is
  # too tight for the local model on this host's CPU (about 40 tokens a second read, 6 written).
  challenge_lite:
    provider: anthropic
    model: claude-haiku-5-5
    effort: low
  # Routine persona wakes: the knobs and validator carry the character; Haiku adds the words.
  tick:
    provider: anthropic
    model: claude-haiku-5-5
    effort: low
  # Talkative navigators (riddles, fine print, directions) opt in via knobs.model_route.
  tick_premium:
    provider: anthropic
    model: claude-sonnet-5-5
    effort: low
  # The one persona whose unmet key results are pure composition and reasoning (Fudgewright: five riddle
  # hunts with honesty tests and fine print, audits of credit claims against the public log) runs its
  # character wakes on Opus 5.5 (chosen 2026-10-23 from the wake records; about a dollar a day at eight
  # ticks of 25k input tokens). Everyone else stays on Haiku or Sonnet.
  tick_opus:
    provider: anthropic
    model: claude-opus-5-5
    effort: medium
  # One public line at the end of a work shift (about 1,800 tokens in, 70 out): on the local model since
  # 2026-10-24, about a minute a line on this host's CPU; the templated line stands when the model is away.
  talk:
    provider: ollama
    model: qwen3.5:9b
    base_url: http://127.0.0.1:11434
    effort: low
    timeout: 180
    temperature: 0.7
    num_ctx: 4096
    keep_alive: 30m
  # Analyst roles and experiments.
  science:
    provider: anthropic
    model: claude-sonnet-5-5
    effort: high
  # The in-character judge and reviews (one call per agent per day).
  review:
    provider: anthropic
    model: claude-sonnet-5-5
    effort: medium
  # The town fool: a local model on this host (Ollama, no key, no cost), never a vendor. The fool's facts are
  # computed from public data; the model only puts them in its words, and the plain sentence stands when the
  # model is away. An ollama route never falls back to a vendor.
  fool:
    provider: ollama
    model: qwen3.5:9b
    base_url: http://127.0.0.1:11434
    effort: low
    num_ctx: 4096  # the same window as the talk route: Ollama reloads the model when the window changes
    keep_alive: 30m
