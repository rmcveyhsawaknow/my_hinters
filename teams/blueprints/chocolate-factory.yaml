# Tubes (the owner's brief of 2026-10-27): coloured pipes that come out of the factory and go back in, to make it
# look wonky. Cell points [bx, by, bz], each leg straight; every tube starts and ends beside a hall's wall and keeps
# to level 6 and above, where a block closes no tile. The candy hall's walls are cells 372-387 x 360-375, the
# packing hall's 372-391 x 380-395; both stand on level ground (no plinth), so their levels are the tubes' levels.
# Each tube rises in its section (default "tubes"); the team file names who raises which.
