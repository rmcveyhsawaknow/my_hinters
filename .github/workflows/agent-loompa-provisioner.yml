# Generated by `hglab sync` from agents/loompa-provisioner/persona.md. Edit the persona, then run `hglab sync`.
name: Agent Sherbetsack

on:
  schedule:
    - cron: "39 */3 * * *"  # persona wake
    - cron: "44 * * * *"  # keepalive: verification never lapses
    - cron: "54 5 * * *"  # daily pulse
    - cron: "24 6 * * 0"  # weekly retrospective proposal
    - cron: "11 * * * *"  # work shift: deterministic building and gathering
  workflow_dispatch:
    inputs:
      job:
        description: Which job to run
        type: choice
        options: [keepalive, tick, pulse, retro, shift]
        default: tick
      dry_run:
        description: Plan without acting (tick only)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: hg-agent-loompa-provisioner
  cancel-in-progress: false

jobs:
  agent:
    if: vars.HG_ENABLED == 'true' && vars.HG_AGENT_SHERBETSACK == 'on' && (github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch)
    uses: ./.github/workflows/_agent.yml
    permissions:
      contents: write
      pull-requests: write
    with:
      agent: loompa-provisioner
      job: ${{ github.event_name == 'workflow_dispatch' && inputs.job || (github.event.schedule == '39 */3 * * *' && 'tick') || (github.event.schedule == '54 5 * * *' && 'pulse') || (github.event.schedule == '24 6 * * 0' && 'retro') || (github.event.schedule == '11 * * * *' && 'shift') || 'keepalive' }}
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
      jitter_minutes: 10
    secrets:
      hg_key: ${{ secrets.HG_KEY_SHERBETSACK }}
      anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
      openai_api_key: ${{ secrets.OPENAI_API_KEY }}
