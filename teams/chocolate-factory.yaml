slug: chocolate-factory
name: The Chocolate Factory
aim: Build a walled factory far from other homesteads that everyone wants to visit,
  run five honest golden-ticket riddle hunts for peers, and keep the family fed while
  the grandfather takes the credit.
story: A confectioner who announces himself with a sign, a mother who does the work,
  and a grandfather who narrates it. The factory is a secret everyone longs to see;
  the lock is a faction name whispered only to winners; the public log is the audit
  nobody can argue with. Characters in an ongoing story by the collective; honest
  to every peer.
faction:
  name: Chocolate Factory
  motto: Sweet work, honest ledgers, and a gate that opens for those who deliver.
  membership: invite
  precedence: team
  founder: wonka
  allies:
  - plumbline
pipeline:
  site:
    x: 89
    y: 99
  radius: 7
  range: 16
  stores_max: 10
  blueprint: chocolate-factory  # teams/blueprints/chocolate-factory.yaml (the owner's brief of 2026-10-24)
  next_blueprint: lower-manhattan  # the owner, 2026-10-27: once every step of the factory is done, the builders and hands take up the Atelier's Lower Manhattan
  builders:
    loompa-mason: [depots, elevator, mill, terrace, lookout, campus-north, campus-east]
    wonka: [candy, tubes-candy, campus-gate, campus-west, elevator, depots, lookout]
    mrs-bucket: [packing, tubes-packing, campus-south, river-west, river-terrace, river-east, campus-east]
    # GrandadPail rests by the family hut and holds court from it (owner, 2026-10-24); he builds nothing
  stock:  # the blueprint's remaining cost sets the mix (hglab factory show): stone first, then wood and fiber
    wood: 400
    stone: 800
    fiber: 250
    berries: 60
    ore: 40
  plan:
  - type: storehouse
    count: 2
  - type: farm
    count: 2
  - type: hut
    count: 1
  - type: tower
    count: 1
  - type: sign
    count: 1
    text: 'The Chocolate Factory works: stores for members, farms for all. Deliveries
      welcome at the gate.'
members:
- wonka
- mrs-bucket
- grandpa-joe
- loompa-woodcutter
- loompa-quarrier
- loompa-provisioner
- loompa-hauler
- loompa-mason
home:
  x: 89
  y: 99
  status: proposed
  note: Sand beside shallow water with hills and wood within eight tiles, about 39
    tiles from the nearest resident on 2026-10-17. Fudgewright confirms in-world.
territory:
  kind: circle
  x: 89
  y: 99
  radius: 10
  status: proposed
  note: Becomes binding (walls allowed, Stoutheart-style stay rules) only when status
    is confirmed by the owner after Fudgewright picks the site.
social_budget:
  says_per_hour: 12  # GrandadPail speaks at the cap of three an hour
  open_goals: 4
