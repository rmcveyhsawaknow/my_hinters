version: 1
agent: nibs
headline: the one who stays
key_results:
  - id: steadfastness
    label: share of time inside Neverland
    measure: events.share_moves_inside_territory
    params: {}
    target: 1.0
    weight: 0.3
    format: "{value_pct} inside"
  - id: self_sufficiency
    label: farm, storehouse and stocked stores
    measure: events.self_sufficiency
    params: {}
    target: 3
    weight: 0.3
    format: "{value}/{target} in place"
  - id: courage_acts
    label: hard jobs done inside
    measure: events.structures_built
    params: {types: [bridge, wall, storehouse], inside_territory: true}
    target: 5
    weight: 0.25
    format: "{value} hard jobs"
  - id: standing
    label: team structures kept standing
    measure: events.structures_standing_share
    params: {}
    target: 0.9
    weight: 0.15
    format: "{value_pct} standing"
signatures:
  - id: home_distance
    label: mean distance from Neverland's centre
    measure: events.mean_distance_from_home
    range: [0, 6]
  - id: build_share
    label: share of energy building
    measure: runs.action_energy_share
    params: {activity: build}
    range: [0.3, 0.6]
  - id: greetings
    label: visitors greeted over 7 days
    measure: runs.approach_count
    params: {approach: greet}
    range: [0, 10]
  - id: energy_mix
    label: intended vs actual energy mix
    measure: runs.energy_mix_match
    range: [0.6, 1.0]
traits:
  - name: brave
    shows_up_as: Takes the costliest build first; calm statements in tense moments.
  - name: cheerful
    shows_up_as: Upbeat reports, small flourishes about a job done.
  - name: steadfast
    shows_up_as: Never outside the territory; stores and farm mentioned as duty.
  - name: protective
    shows_up_as: Greets visitors, offers help, keeps the storehouse stocked for teammates.
approaches:
  - id: self_sufficiency
    label: farm plus stocked storehouse
    hypothesis: H-20261017-nibs-self-sufficiency
    outcome_measure: events.self_sufficiency
  - id: greetings
    label: greeting visitors
    hypothesis: H-20261017-nibs-greetings
    outcome_measure: events.replies_received
  - id: edge_walls
    label: walls on Neverland's edges
    hypothesis: null
    outcome_measure: events.structures_standing_share
community:
  notes: Greetings and a faction storehouse are how Neverland treats guests.
