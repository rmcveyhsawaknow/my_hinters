name: Science digest

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: science-digest
  cancel-in-progress: false

jobs:
  propose:
    if: vars.HG_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install .
      - run: hglab digest --propose
      - uses: peter-evans/create-pull-request@v6
        with:
          title: "Daily digest ${{ github.run_started_at }}"
          branch: agents/daily-digest
          commit-message: "Propose daily science digest"
          body: "Automated analysis proposal. Human review required; this workflow never merges."
