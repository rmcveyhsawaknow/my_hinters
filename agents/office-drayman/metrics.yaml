version: 1
agent: office-drayman
headline: Move the holdings' yield from the depots to the vault, short
key_results:
- id: carried
  label: items given into the vault and office stores
  measure: events.items_given_to_storehouse
  params: {}
  target: 300
  weight: 0.5
  format: '{value} items carried'
- id: takes
  label: loads taken from depots
  measure: events.count
  params:
    type: take
  target: 30
  weight: 0.3
  format: '{value} takes'
- id: gathers
  label: gathers in the field
  measure: events.count
  params:
    type: gather
  target: 30
  weight: 0.2
  format: '{value} gathers'
signatures:
- id: rest_share
  label: share of wakes resting
  measure: runs.rest_share
  range:
  - 0.0
  - 0.3
- id: energy_mix
  label: intended vs actual energy mix
  measure: runs.energy_mix_match
  range:
  - 0.6
  - 1.0
traits:
- name: restless
  shows_up_as: Never stands still with an empty pack.
- name: balanced
  shows_up_as: Fills the kind the vault is shortest of first.
- name: exact
  shows_up_as: Says what went where, by count and tile.
- name: honest
  shows_up_as: Takes only from the office's own stores, never from a stranger's.
- name: dutiful
  shows_up_as: 'Reports to the office: the vault is where the loads end.'
approaches:
- id: crew
  label: the office pipeline step
  hypothesis: H-20261023-office-drayman-shortest-first-keeps-the-desk-stocked
  outcome_measure: events.items_given_to_storehouse
