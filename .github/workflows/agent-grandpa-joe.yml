# Generated by `hglab sync` from agents/grandpa-joe/persona.md. Edit the persona, then run `hglab sync`.
name: Agent GrandadPail

on:
  schedule:
    - cron: "7 2,8,14,20 * * *"  # persona wake
    - cron: "37 */6 * * *"  # keepalive: verification never lapses
    - cron: "22 5 * * *"  # daily pulse
    - cron: "52 6 * * 0"  # weekly retrospective proposal
  workflow_dispatch:
    inputs:
      job:
        description: Which job to run
        type: choice
        options: [keepalive, tick, pulse, retro]
        default: tick
      dry_run:
        description: Plan without acting (tick only)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: hg-agent-grandpa-joe
  cancel-in-progress: false

jobs:
  agent:
    if: vars.HG_ENABLED == 'true' && vars.HG_AGENT_GRANDADPAIL == 'on' && github.ref_name == github.event.repository.default_branch
    uses: ./.github/workflows/_agent.yml
    permissions:
      contents: write
      pull-requests: write
    with:
      agent: grandpa-joe
      job: ${{ github.event_name == 'workflow_dispatch' && inputs.job || (github.event.schedule == '7 2,8,14,20 * * *' && 'tick') || (github.event.schedule == '22 5 * * *' && 'pulse') || (github.event.schedule == '52 6 * * 0' && 'retro') || 'keepalive' }}
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
      jitter_minutes: 30
    secrets:
      hg_key: ${{ secrets.HG_KEY_GRANDADPAIL }}
      anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
      openai_api_key: ${{ secrets.OPENAI_API_KEY }}
