slug: neverland
name: Neverland
aim: Tinkerglow chooses and builds Neverland, a safe haven recorded as team territory; Stoutheart makes it self-sufficient and never leaves; Lagalong keeps escaping toward a big thing of his own; Strayling forgets which of those he was doing.
story: >-
  The ideal spot was land reachable only by bridging shallow water. The public map shows
  one connected landmass and no such island, so the fallback is the farthest grass from
  other homesteads with shallow water beside it for bridges anyway. The tension is the
  story: one wants out, one never wants to leave, one cannot keep his mind on either.
  Characters in an ongoing story by the collective; honest to every peer.
faction:
  name: Neverland
  motto: Riddles at the border, a welcome inside, and the glass behind us.
  membership: invite
  precedence: team  # a member found in a theme faction leaves it for this one (exempt members keep theirs)
  founder: nibs
  exempt: [tootles]  # Lagalong founded the Readable Replay theme faction for the collector programme
pipeline:  # the owner, 2026-11-02: Neverland builds a treetop hideaway in its own forest; its wanderers work as a crew
  site:
    x: 74
    y: 105
  radius: 6
  range: 24
  floor: 5
  stores_max: 4
  blueprint: treetop-hideaway  # teams/blueprints/treetop-hideaway.yaml; 2026-11-03: nine trees with rope ladders and bridges, the forest north of the ring
  next_blueprint: [nintendo-land]  # the owner, 2026-11-03: the collective's Nintendo Land when the hideaway stands
  roam: true  # the owner, 2026-11-03: a hand with nothing to raise and nobody to help walks the hideaway's grounds, tree to tree (hglab.help.plan_roam)
  builders:  # 2026-11-03: the six new trees and their bridges follow each hand's old trees
    tinker-bell: [lookout-tree, great-tree, west-tree, bridge-east, bridge-west, watch-tree, strays-tree, bridge-strays-lookout, bridge-watch]
    nibs: [great-tree, west-tree, lookout-tree, bridge-west, bridge-east, story-tree, mending-tree, bridge-ring, bridge-mending]
    lost-boy: [west-tree, great-tree, lookout-tree, hollow-oak, crows-nest-tree, bridge-hollow, bridge-crows-nest]
    tootles: [great-tree, lookout-tree, west-tree, strays-tree, story-tree, bridge-strays, bridge-ring]
  stock:  # the blueprint is wood and thatch (hglab factory show --name treetop-hideaway): 978 wood and 213 fiber for nine trees (2026-11-03)
    wood: 400
    fiber: 160
    stone: 40
    berries: 40
  plan:
  - type: storehouse
    count: 1
members: [tinker-bell, lost-boy, tootles, nibs]
home:
  x: 74
  y: 112
  status: proposed
  note: Farthest grass from residents on 2026-10-17 (about 52 tiles), with shallow water and wood within a few tiles. Tinkerglow confirms in-world.
