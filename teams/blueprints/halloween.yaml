# Halloween at Winter River, as blocks (the owner's brief of 2026-11-05): "when all building is complete and signs
# made, plan a new area that is halloween area with all the creepy things and beetlejuice is the main character
# theme ... based on the model town in the movie beetlejuice and the opening scene". Inspired by the film's town and
# its afterlife, built in our own words and shapes: the names of places and things only, no quoted lines, no logos.
#
# The opening of the film glides over wooded hills and the rooftops of a small New England town to a white house on
# a hill, and only when a spider walks across that house's roof does it show that the town is a model on a table in
# the attic. So this land is laid out as that model: the woods in the north-west, the Maitland house on its hill
# above them, the river below it with the red covered bridge on the road into town, Village Street running south with
# the white church, the hardware store beside it, the library with its lions, Miss Shannon's School for Girls and the
# fire house, and on the river's other bank the model's graveyard, where the ghost in the striped suit stands beside
# his crypt. A spider as big as the roof crosses the house; the afterlife keeps its waiting room at the end of the
# street and its striped sandworm in the dunes by the sea. The creepy things of Halloween fill the rest: bare black
# trees with their crows and drifting lights, rows of headstones, a pumpkin patch with a scarecrow, a great carved
# jack-o'-lantern, a house with dark windows and one where every window glows orange.
#
# The site: the east of the island's north, x 95-114, y 28-54, between Nintendo Land (x 94 and west) and the land
# office's walled lots (y 55 and south), on the lots J02-SE, J03-NE, J03-SE, J04-NE, J04-SE, J05-NE, K02-SW, K03-*,
# K04-*, K05-NW, K05-NE, L03-SW, L04-NW, L04-SW and L05-NW: the ground the collective holds by contract with the land
# office (no `land` block: nothing waits on a deed). Read from the public world of tick 170600
# (`hglab factory survey --x0 94 --y0 24 --x1 124 --y1 62`, runs/local/world.json, the public blocks): forest in the
# west (x 95-101, the woods of the film's hills), grass in the middle and east, a strip of sand along the sea (x 113-
# 115); about ninety wood, fiber and berry nodes and no stone or ore node; no block of anyone's; LandBroker's two roads
# at (102,31) and (106,32), which the river and Village Street pass over as slabs, a sign of his at (98,26) and a
# cache at (102,48), which the river goes round. The office's claim sign stands on every lot's centre tile (x 97,
# 102, 107, 112; y 27, 32, ... 52): the river runs down column 102 and Village Street down column 107 as slabs at
# level 0, and no other block below level 6 stands on a centre. Every building keeps a lane at least a tile wide to
# the next one; the lanes, the streets and the river close nothing.
#
# Who builds it: every team, last of all: `after` names every other design, so no team's chain opens it before the
# factory, the New York replica, the hideaway, Nintendo Land and the signposts are all done. Sculptures (style
# `sculpture`, `boxes` of cells from the section's north-west cell) draw what no style does: the spider, the ghost,
# the sandworm, the pumpkins, the lions. Every box is at most 160 cells, so a pack pays for any step; `commute`
# carries the material from the builders' stores. The house's hill is its plinth, green (`foundation_block`), three
# levels under the house and one under its slopes; the other buildings stand on surveyed plinths (terrain3d), the
# figures on theirs so they stand straight. No metal anywhere.
#
# Tiles are [x0, y0, x1, y1], inclusive; cells are 4 per tile. Colours: natural white grey black brown red orange
# yellow lime green teal cyan blue indigo purple pink tan. Materials: wood (wood), stone (stone), thatch (fiber).
# Generated by a script from the survey; edit by hand from here on, and keep `hglab factory check` clean.
name: Halloween at Winter River
title: the Halloween blueprint  # how a builder's reasons name it
team: commons  # the whole collective's: every team builds it last (the field is informational)
plots: [J02, J03, J04, J05, K02, K03, K04, K05, L03, L04, L05]  # only the east half of J and the west half of L are ours
version: 1
foundation_block: [stone, grey]
commute: true
after: ["chocolate-factory", "lower-manhattan", "midtown", "central-park", "uptown", "treetop-hideaway", "nintendo-land", "signposts"]  # the owner, 2026-11-05: once all the building is complete and every sign made
story: >-
  A small New England town on Halloween night, laid out like the model a man once built in his attic: the white
  farmhouse on its hill above the woods, a red covered bridge over the river, Village Street with its church,
  hardware store, library, school and fire house, and a graveyard across the water where a ghost in a striped suit
  waits to be called. A spider as big as the roof crosses the house, a jack-o'-lantern grins over the patch, and
  at the end of the street the afterlife keeps its waiting room and its sandworm.
