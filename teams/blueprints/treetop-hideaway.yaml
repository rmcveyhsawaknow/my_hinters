# The Treetop Hideaway, as blocks (the owner's instruction of 2026-11-02): Neverland builds up into its own
# forest. Three treehouses on free forest tiles inside the ring of riddle signs, joined by rope bridges, all of
# it wood and thatch from the woods around.
#
# Read from the public world of tick 142000: the forest fills the ring from the signs on row 102 down to the
# farms on rows 109-110, the roads Tinkerglow laid cross it at (70-74,107-108) and (77-79,101-105), and
# Stoutheart's hut stands at (69,107), Tinkerglow's at (80,104) with her house blocks on (79,104) and (80,105).
# Every trunk stands on a forest tile with no node, structure or block (a trunk closes its tile); the decks lie
# at level 6, where a block closes no tile, so the roads and the wood nodes under them stay open. A treehouse
# keeps no plinth (the deck is its one plane), so no foundation rows: the ground survey is not applied here.
#
# Tiles are [x0, y0, x1, y1], inclusive; cells are 4 per tile. Colours: natural white grey black brown red orange
# yellow lime green teal cyan blue indigo purple pink tan. Materials: wood (wood), thatch (fiber).
#
# Grown by twice what stood (the owner's instruction of 2026-11-03): six more treehouses, a rope ladder up every
# trunk, and seven more rope bridges, so the nine trees make one hideaway. Read from the public world of tick
# 153234 (runs/local/world.json and the public blocks): inside the ring only two spots were still clear of huts,
# roads and the old trees' blocks, the Strays' Tree by Tinkerglow's hut and the Crow's Nest Tree under the West
# Tree, so four of the new trees stand in the forest north of the ring, rows 96-102, between the land office's
# walled lots on the west (G09, F09) and the roads to the Chocolate Factory's west gate on the east. Every new
# tile keeps three tiles or more from the campus wall (x 80, y 99), so nothing new stands east of x 77 north of
# row 102. Every new trunk is on forest with no node, structure, block or lot centre, and none on the ring's rows or
# columns; the decks pass over roads, nodes, Tinkerglow's sign at (66,102) and five lot centres with no claim sign on
# them, at levels 6 and 7, where they close nothing, and over no wall, hut, farm or store. The Mending Tree and the
# Crow's Nest Tree touch the West Tree's deck edge to edge, a level higher, so they read as its terraces.
#
# The new trees carry `ladders: true`. The old three get their ladders as thatch tubes in their own sections,
# after their last step (great-tree:22-25, west-tree:19-21, lookout-tree:20-22): `ladders: true` on an old tree
# would put each ladder straight after its trunk and renumber the steps the ledger already names. The cells and
# the actions are the ones `ladders: true` makes, so the ledger would carry over if the expander ever hangs the
# ladders after a tree's last step.
name: The Treetop Hideaway
title: the Treetop Hideaway blueprint  # how a builder's reasons name it
team: neverland
version: 1
foundation_block: [wood, brown]
story: >-
  Three trees over the forest floor of Neverland: the Great Tree in the middle, where the fire is kept and the
  store stands below, the West Tree where Strayling forgets what he came for, and the Lookout Tree by the
  opening in the ring, where Tinkerglow watches the water for whoever she will find next. Rope bridges swing
  between them, high enough that nobody's way through the woods is barred.
