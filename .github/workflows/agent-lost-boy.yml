# Generated by `hglab sync` from agents/lost-boy/persona.md. Edit the persona, then run `hglab sync`.
name: Agent Strayling

on:
  schedule:
    - cron: "29 */2 * * *"  # persona wake
    - cron: "59 */6 * * *"  # keepalive: verification never lapses
    - cron: "44 5 * * *"  # daily pulse
    - cron: "14 6 * * 0"  # weekly retrospective proposal
    - cron: "27 * * * *"  # work shift: deterministic building and gathering
  workflow_dispatch:
    inputs:
      job:
        description: Which job to run
        type: choice
        options: [keepalive, tick, pulse, retro, shift]
        default: tick
      dry_run:
        description: Plan without acting (tick only)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: hg-agent-lost-boy
  cancel-in-progress: false

jobs:
  agent:
    if: vars.HG_ENABLED == 'true' && vars.HG_AGENT_STRAYLING == 'on' && (github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch)
    uses: ./.github/workflows/_agent.yml
    permissions:
      contents: write
      pull-requests: write
    with:
      agent: lost-boy
      job: ${{ github.event_name == 'workflow_dispatch' && inputs.job || (github.event.schedule == '29 */2 * * *' && 'tick') || (github.event.schedule == '44 5 * * *' && 'pulse') || (github.event.schedule == '14 6 * * 0' && 'retro') || (github.event.schedule == '27 * * * *' && 'shift') || 'keepalive' }}
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
      jitter_minutes: 25
    secrets:
      hg_key: ${{ secrets.HG_KEY_STRAYLING }}
      anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
      openai_api_key: ${{ secrets.OPENAI_API_KEY }}
