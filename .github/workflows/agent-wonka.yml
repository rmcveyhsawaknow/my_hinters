# Generated by `hglab sync` from agents/wonka/persona.md. Edit the persona, then run `hglab sync`.
name: Agent Fudgewright

on:
  schedule:
    - cron: "23 1,4,7,10,13,16,19,22 * * *"  # persona wake
    - cron: "36 * * * *"  # keepalive: verification never lapses
    - cron: "38 5 * * *"  # daily pulse
    - cron: "8 6 * * 0"  # weekly retrospective proposal
    - cron: "3 * * * *"  # work shift: deterministic building and gathering
  workflow_dispatch:
    inputs:
      job:
        description: Which job to run
        type: choice
        options: [keepalive, tick, pulse, retro, shift]
        default: tick
      dry_run:
        description: Plan without acting (tick only)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: hg-agent-wonka
  cancel-in-progress: false

jobs:
  agent:
    if: vars.HG_ENABLED == 'true' && vars.HG_AGENT_FUDGEWRIGHT == 'on' && (github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch)
    uses: ./.github/workflows/_agent.yml
    permissions:
      contents: write
      pull-requests: write
    with:
      agent: wonka
      job: ${{ github.event_name == 'workflow_dispatch' && inputs.job || (github.event.schedule == '23 1,4,7,10,13,16,19,22 * * *' && 'tick') || (github.event.schedule == '38 5 * * *' && 'pulse') || (github.event.schedule == '8 6 * * 0' && 'retro') || (github.event.schedule == '3 * * * *' && 'shift') || 'keepalive' }}
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
      jitter_minutes: 20
    secrets:
      hg_key: ${{ secrets.HG_KEY_FUDGEWRIGHT }}
      anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
      openai_api_key: ${{ secrets.OPENAI_API_KEY }}
