# The land office ledger. LandBroker (the registrar) surveys the world in 10 by 10 plots
# (columns A-M by x, rows 00-12 by y), registers a plot for the posted fee, keeps the
# registry in its public profile and on deed signs, and buys surplus through standing
# offers. A registration is a dated public record and a mediator's promise; the world
# enforces no land rights, and the office says so when asked. Humans edit this file by
# PR; registrations made in the world live in the registrar's notebook and profile.
registrar: land-broker
grid: 10
fee: {wood: 5}
fee_reward: {berries: 1}
registration_title: "Register a 10x10 plot with LandBroker"
# Lots for sale: the office stakes every free 5x5 lot with one claim sign (its anchor tile) and sells
# lots through one standing goal whose price in wood rises as free lots run out (base while land is
# plentiful, double at half full, ten times at a tenth free, never above the cap one give can carry).
# A 10x10 plot is four lots: buy four. Buying a lot earns its deed; the office keeps the sign as the
# marker and rewrites it with the buyer's name when it passes.
lots:
  size: 5
  currency: wood
  base_price: 5
  price_cap: 50
  sale_title: "Buy a 5x5 lot from the land office"
  sale_reward: {berries: 1}
# Site requests: a client's brief for ground to build on. The office surveys once (the best free lot
# that is buildable, can grow into free lots beside it, lies near what the brief names and has the
# resources it wants), whispers the client the lot and its price, says so in public, and deeds the lot
# once the price has been given into an office storehouse. Humans edit the briefs here by PR.
site_requests:
  - id: factory
    client: Fudgewright
    size: 5
    expandable: 2
    min_buildable: 20
    wants: [ore, stone]
    near:
      - {label: Neverland, x: 74, y: 112, weight: 3, max: 45}
    prefer: {y_min: 80}
    note: The Chocolate Factory wants a 5x5 lot it can expand into, near the southern mountains and close to Neverland, with gold (ore) and fudge (stone) in reach.
  - id: works
    client: Fudgewright
    lots: [I09-SE, I09-NE]
    wants: [ore, stone]
    note: The ground under the Chocolate Factory works at (89,99) and its stores at (85,92) and (87,94), deeded as the factory's own at the owner's instruction of 2026-10-24; paid into any office storehouse with room or into the registrar's hands.
  - id: grounds
    client: Fudgewright
    lots: [I08-NW, I08-NE, I08-SW, I08-SE, J08-NW, J08-NE, J08-SW, J08-SE, I09-NW, I09-SW, J09-NW, J09-NE, J09-SW, J09-SE]
    wants: [ore, stone]
    note: The rest of the factory's four plots (I08, J08, I09, J09), from the bay up the hill belt to the foot of the eastern peak, for the blueprint of 2026-10-24; withdrawn from the office's holdings while under contract (teams/exchange.yaml claims.exclude).
# The sales desk (the owner's instruction of 2026-10-23): the office keeps its best staked lots as holdings
# (teams/exchange.yaml: pipeline.claims), its hands work their nodes into the vault, and the vault's goods
# are sold through self-confirming goals: the buyer gives the price into the vault and the goods pay out at
# once. A sale is listed when the pack holds the goods; the office takes them from the vault when it holds
# at least min_stock. Nobody in the collective may claim these; they are for the other residents.
sales:
  - {id: ore-for-wood, sell: {ore: 10}, price: {wood: 30}, min_stock: 20, status: open}
  - {id: stone-for-berries, sell: {stone: 20}, price: {berries: 10}, min_stock: 60, status: open}
  - {id: wood-for-berries, sell: {wood: 20}, price: {berries: 8}, min_stock: 80, status: open}
offers:
  - {id: wood-for-berries, want: {wood: 10}, reward: {berries: 2}, status: open}
  - {id: stone-for-berries, want: {stone: 10}, reward: {berries: 3}, status: open}
plots: []
