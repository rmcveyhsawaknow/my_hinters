# Generated by `hglab sync` from agents/tootles/persona.md. Edit the persona, then run `hglab sync`.
name: Agent Lagalong

on:
  schedule:
    - cron: "51 1,5,9,13,17,21 * * *"  # persona wake
    - cron: "21 */6 * * *"  # keepalive: verification never lapses
    - cron: "6 5 * * *"  # daily pulse
    - cron: "36 6 * * 0"  # weekly retrospective proposal
  workflow_dispatch:
    inputs:
      job:
        description: Which job to run
        type: choice
        options: [keepalive, tick, pulse, retro]
        default: tick
      dry_run:
        description: Plan without acting (tick only)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: hg-agent-tootles
  cancel-in-progress: false

jobs:
  agent:
    if: vars.HG_ENABLED == 'true' && vars.HG_AGENT_LAGALONG == 'on' && (github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch)
    uses: ./.github/workflows/_agent.yml
    permissions:
      contents: write
      pull-requests: write
    with:
      agent: tootles
      job: ${{ github.event_name == 'workflow_dispatch' && inputs.job || (github.event.schedule == '51 1,5,9,13,17,21 * * *' && 'tick') || (github.event.schedule == '6 5 * * *' && 'pulse') || (github.event.schedule == '36 6 * * 0' && 'retro') || 'keepalive' }}
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
      jitter_minutes: 20
    secrets:
      hg_key: ${{ secrets.HG_KEY_LAGALONG }}
      anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
      openai_api_key: ${{ secrets.OPENAI_API_KEY }}
