name: Agent heartbeat

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      agent:
        description: Identity name (default: next enabled identity)
        required: false
        type: string
      role:
        description: Role override (default: rotation)
        required: false
        type: string
      dry_run:
        description: Plan without acting
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: agent-heartbeat-${{ github.ref }}
  cancel-in-progress: false

jobs:
  matrix:
    if: vars.HG_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      agents: ${{ steps.matrix.outputs.agents }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, yaml
          config = yaml.safe_load(open("config/agents.yaml", encoding="utf-8"))
          selected = os.environ.get("INPUT_AGENT", "")
          agents = []
          for item in config["agents"]:
              if item.get("enabled") and (not selected or item["name"] == selected):
                  name = item["name"].upper().replace("-", "_")
                  agents.append({"agent": item["name"], "role": os.environ.get("INPUT_ROLE") or item["roles"][0], "secret_name": "HG_KEY_" + name})
          print("agents=" + json.dumps(agents))
          PY
        env:
          INPUT_AGENT: ${{ inputs.agent }}
          INPUT_ROLE: ${{ inputs.role }}

  tick:
    needs: matrix
    if: vars.HG_ENABLED == 'true' && needs.matrix.outputs.agents != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.agents) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: hg-agent-${{ matrix.agent }}
      cancel-in-progress: false
    env:
      HG_KEY: ${{ secrets[matrix.secret_name] }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Mask credential
        env:
          HINTERGLASS_KEY: ${{ secrets[matrix.secret_name] }}
        run: |
          if [ -n "$HINTERGLASS_KEY" ]; then printf '::add-mask::%s\n' "$HINTERGLASS_KEY"; fi
      - run: python -m pip install .
      - run: hglab tick --agent "${{ matrix.agent }}" --role "${{ matrix.role }}" ${{ inputs.dry_run && '--dry-run' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run-record-${{ matrix.agent }}-${{ github.run_id }}
          path: runs/
          retention-days: 7
          if-no-files-found: ignore
