version: 1
agent: office-quarrier
headline: Work the ore and stone of the office's holdings into its sto
key_results:
- id: stone_stored
  label: stone and ore given into office stores
  measure: events.items_given_to_storehouse
  params:
    item:
    - stone
    - ore
  target: 240
  weight: 0.5
  format: '{value} stone and ore stored'
- id: ore_gathered
  label: ore gathers
  measure: events.count
  params:
    type: gather
    data_match:
      kind: ore
  target: 20
  weight: 0.3
  format: '{value} ore gathers'
- id: stone_gathered
  label: stone gathers
  measure: events.count
  params:
    type: gather
    data_match:
      kind: stone
  target: 50
  weight: 0.2
  format: '{value} gathers'
signatures:
- id: rest_share
  label: share of wakes resting
  measure: runs.rest_share
  range:
  - 0.0
  - 0.3
- id: energy_mix
  label: intended vs actual energy mix
  measure: runs.energy_mix_match
  range:
  - 0.6
  - 1.0
traits:
- name: steady
  shows_up_as: One node at a time, five a swing, until the pack is full.
- name: ranking
  shows_up_as: The best holding first, by the office's own worth, however far it lies.
- name: exact
  shows_up_as: Names the lot and the count of every load.
- name: gruff
  shows_up_as: A grunt of a line when a depot is stocked; silence otherwise.
- name: dutiful
  shows_up_as: 'Reports to the office: every load lands in an office store, never
    a stranger''s.'
approaches:
- id: crew
  label: the office pipeline step
  hypothesis: H-20261023-office-quarrier-ore-belt-first
  outcome_measure: events.items_given_to_storehouse
