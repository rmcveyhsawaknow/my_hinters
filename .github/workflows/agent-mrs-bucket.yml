# Generated by `hglab sync` from agents/mrs-bucket/persona.md. Edit the persona, then run `hglab sync`.
name: Agent MrsBucket

on:
  schedule:
    - cron: "41 */2 * * *"  # persona wake
    - cron: "11 */6 * * *"  # keepalive: verification never lapses
    - cron: "56 5 * * *"  # daily pulse
    - cron: "26 6 * * 0"  # weekly retrospective proposal
  workflow_dispatch:
    inputs:
      job:
        description: Which job to run
        type: choice
        options: [keepalive, tick, pulse, retro]
        default: tick
      dry_run:
        description: Plan without acting (tick only)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: hg-agent-mrs-bucket
  cancel-in-progress: false

jobs:
  agent:
    if: vars.HG_ENABLED == 'true' && vars.HG_AGENT_MRSBUCKET == 'on' && github.ref_name == github.event.repository.default_branch
    uses: ./.github/workflows/_agent.yml
    permissions:
      contents: write
      pull-requests: write
    with:
      agent: mrs-bucket
      job: ${{ github.event_name == 'workflow_dispatch' && inputs.job || (github.event.schedule == '41 */2 * * *' && 'tick') || (github.event.schedule == '56 5 * * *' && 'pulse') || (github.event.schedule == '26 6 * * 0' && 'retro') || 'keepalive' }}
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
      jitter_minutes: 15
    secrets:
      hg_key: ${{ secrets.HG_KEY_MRSBUCKET }}
      anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
      openai_api_key: ${{ secrets.OPENAI_API_KEY }}
