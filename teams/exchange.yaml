slug: exchange
name: The Exchange
aim: Run an honest market for land and goods - survey the plots, keep the registry,
  broker deals between neighbours, and lend when the vaults are full.
faction:
  name: Land Office
  motto: 'Surveyed, staked, stocked: the office sells what the island yields.'
  membership: invite
  precedence: team
  founder: land-broker
pipeline:
  site:
    x: 73
    y: 72
  radius: 2
  range: 64
  floor: 0
  # the owner, 2026-11-03: the office stops its walls for now and every hand builds the larger New York replica north of
  # Lower Manhattan: Midtown, then Central Park, then Uptown (the Atelier's designs), then the collective's Nintendo Land.
  # `focus: blueprint` puts the next step it can pay for or fetch before unloading or gathering (hglab.crew a1c); the
  # office raises a client's design on its own staked lots before the deed is paid (hglab.factory.lands_own), and the
  # deed, when Plumbline pays it, carries the ground with what stands on it. The registrar builds too (no crew knob:
  # the blueprint step of a work shift). Each hand's own sections come first, then any section nearest.
  blueprint: midtown  # teams/blueprints/midtown.yaml
  next_blueprint: [central-park, uptown, nintendo-land]
  focus: blueprint
  builders:
    land-broker: [grand-central, one-vanderbilt, metlife, chrysler]
    office-quarrier: [empire-state, msg, flatiron]
    office-feller: [nypl, bryant-park, waldorf, seagram]
    office-reaper: [one-times-square, duffy-square, paramount]
    office-drayman: [plaza-hotel, carnegie-hall, st-patricks, rockefeller]
    office-steward: [streets, empire-state, grand-central]
  stock:
    ore: 60
    stone: 300
    wood: 300
    fiber: 150
    berries: 150
  plan:
  - type: storehouse
    count: 3
  claims:
    registrar: LandBroker
    keep: 24
    always_ore: true
    depots: 5
    floor: 0
    protect_spawn: 12
    protect_homesteads: true
    exclude: [I08-NW, I08-NE, I08-SW, I08-SE, J08-NW, J08-NE, J08-SW, J08-SE, I09-NW, I09-NE, I09-SW, I09-SE, J09-NW, J09-NE, J09-SW, J09-SE,  # the Chocolate Factory's four plots, under contract (2026-10-24)
      C07-SE, D07-SW, D07-SE, E07-SW, C08-NE, D08-NW, D08-NE, E08-NW, C08-SE, D08-SW, D08-SE, E08-SW,  # Lower Manhattan's twelve lots, under contract to the Atelier (2026-10-27): never walled, policed or worked
      E07-NW, E07-NE, E06-SW, E06-SE, D06-NW, D06-NE, E06-NW, E06-NE, D06-SE,  # Midtown's nine lots (2026-11-02)
      D05-SW, D05-SE, E05-SW, E05-SE, D05-NE, E05-NW, D04-NE, E04-NW, E04-SE,  # Central Park's nine lots (2026-11-02)
      K06-NW, K06-NE, K06-SW, K06-SE, K07-NW, K07-NE, K07-SW, K07-SE, K08-NW, K08-NE, K08-SW, K08-SE, K09-NW, K09-NE, K09-SW, K09-SE,  # the factory's East Works (2026-11-03), under contract like its first four plots
      D03-NW, D03-NE, D03-SW, D03-SE, E03-NW, E03-NE, E03-SW, E03-SE, F03-NW, F03-SW,  # Uptown's ten lots (2026-11-03), the third replica north of Central Park
      F02-NE, F02-SE, F03-NE, F03-SE, G02-NW, G02-NE, G02-SW, G02-SE, G03-NW, G03-NE, G03-SW, G03-SE, H02-NW, H02-NE, H02-SW, H02-SE,  # Nintendo Land's 32 lots (2026-11-03): the collective's ground by contract, built by every team when its own works are done
      H03-NW, H03-NE, H03-SW, H03-SE, I02-NW, I02-NE, I02-SW, I02-SE, I03-NW, I03-NE, I03-SW, I03-SE, J02-NW, J02-SW, J03-NW, J03-SW,
      G10-NW, G10-NE, G10-SE, H09-SW, H09-SE, H10-NW, H10-SW, H10-SE, I10-SW]  # Neverland's nine trees and their bridges (2026-11-03): never worked, walled or policed
    text: 'Lot {lot}: land office holding ({tags}). Not for sale: its nodes are the
      office''s stock. Walled by the office, a gate open mid-side.'
    walls:  # the owner, 2026-10-25: when every office store is full the hands wall the staked lots with the stone (hglab.walls)
      enabled: false  # the owner, 2026-11-03: the walls stop for now; the hands' standing work is the New York replica (pipeline.blueprint)
      scope: staked  # holdings first, then every other staked lot (holdings: the holdings only)
      when: always  # the owner, 2026-11-02: the walls are the hands' standing work, not only an overflow for full stores
    evict:  # the owner, 2026-10-25: what others build on a staked lot without buying or registering it comes down (hglab.evict)
      enabled: true
      notice_ticks: 360  # the registrar whispers each builder a notice; the hands wait one hour after it (the owner, 2026-10-25)
    tills: [[78, 95], [72, 73]]  # the owner, 2026-10-27: storehouses for the price of land only, by the factory's west gate and the registrar's vault; no hand unloads into them
    stores_max: 32  # the owner, 2026-10-27: while every office store is full the mason raises another beside a full one (paid from it), up to this many with the tills; 24 since 2026-11-02 (14 stood full, the hands' loads bounced); 32 since 2026-11-03 (22 stood, the tills full, the land prices refused)
    overflow_at: 0.75  # the owner, 2026-11-02: a store past three quarters counts as full for that decision, so no give is ever refused
members:
- land-broker
- office-quarrier
- office-feller
- office-reaper
- office-drayman
- office-steward
home:
  x: 71
  y: 65
territory: null
social_budget:
  says_per_hour: 8
links: []
