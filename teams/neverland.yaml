slug: neverland
name: Neverland
aim: Tinker Bell chooses and builds Neverland, a safe haven recorded as team territory; Nibs makes it self-sufficient and never leaves; Tootles keeps escaping toward a big thing of his own; the Lost Boy forgets which of those he was doing.
story: >-
  The ideal spot was land reachable only by bridging shallow water. The public map shows
  one connected landmass and no such island, so the fallback is the farthest grass from
  other homesteads with shallow water beside it for bridges anyway. The tension is the
  story: one wants out, one never wants to leave, one cannot keep his mind on either.
  Characters in an ongoing story by the collective; honest to every peer.
members: [tinker-bell, lost-boy, tootles, nibs]
