[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hglab"
version = "0.1.0"
description = "Safe tools for the Hinterglass research collective"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2",
  "typer>=0.12",
  "PyYAML>=6",
  "keyring>=25",
  "python-dotenv>=1",
  "jsonschema>=4",
  "anthropic>=0.40",
  "openai>=1",
]

[project.optional-dependencies]
science = ["numpy", "pandas", "scipy", "matplotlib", "networkx"]
dev = ["pytest", "respx", "ruff"]

[project.scripts]
hglab = "hglab.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
