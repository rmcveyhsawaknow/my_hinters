name: Agent (reusable)

# Called by the generated per-agent workflows (agent-<slug>.yml). Never triggered directly.
# Three jobs: keepalive (observe, answer any verification challenge, record presence; no LLM
# unless there is a challenge), tick (a persona wake), pulse (refresh reports), plus a weekly
# retro that proposes persona or metric changes as a pull request. Reports live on the
# `reports` branch. Secrets arrive explicitly from the caller, one by one, never wholesale.
#
# Hand-over with the local host (the owner, 2026-10-30): a live local supervisor sets the repository
# variable HG_LOCAL_HEARTBEAT every ten minutes. While it is younger than HG_LOCAL_STALE_MINUTES (30)
# every scheduled job here stands down; when the host goes away the next scheduled run takes over.
# A manual dispatch always runs. The blueprint ledgers are rebuilt from the world before each wake.

on:
  workflow_call:
    inputs:
      agent:
        description: Persona slug (folder under agents/)
        required: true
        type: string
      job:
        description: keepalive, tick, pulse or retro
        required: true
        type: string
      dry_run:
        description: Plan without acting (tick only)
        required: false
        type: boolean
        default: false
      jitter_minutes:
        description: Random delay before a tick, from the persona cadence
        required: false
        type: number
        default: 0
    secrets:
      hg_key:
        description: This agent's Hinterglass key (HG_KEY_<AGENT>)
        required: true
      anthropic_api_key:
        required: false
      openai_api_key:
        required: false

permissions:
  contents: read

env:
  HGLAB_RUNTIME: actions-anthropic
  PYTHONUTF8: "1"

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run: ${{ steps.local.outputs.run }}
    steps:
      - id: local
        name: Stand down while the local host runs the agents
        env:
          HEARTBEAT: ${{ vars.HG_LOCAL_HEARTBEAT }}
          STALE_MINUTES: ${{ vars.HG_LOCAL_STALE_MINUTES || '30' }}
          EVENT: ${{ github.event_name }}
        run: |
          run=true
          if [ "$EVENT" != "workflow_dispatch" ] && [ -n "$HEARTBEAT" ] && beat="$(date -u -d "$HEARTBEAT" +%s 2>/dev/null)"; then
            age=$(( $(date -u +%s) - beat ))
            if [ "$age" -lt $(( STALE_MINUTES * 60 )) ]; then
              run=false
              echo "The local host runs the agents (heartbeat $HEARTBEAT, $(( age / 60 )) minutes ago): standing down." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  keepalive:
    needs: gate
    if: needs.gate.outputs.run == 'true' && (inputs.job == 'keepalive' || inputs.job == 'tick')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install .
      - name: Mask and export keys
        env:
          HINTERGLASS_KEY: ${{ secrets.hg_key }}
          ANTHROPIC_KEY: ${{ secrets.anthropic_api_key }}
          OPENAI_KEY: ${{ secrets.openai_api_key }}
          AGENT: ${{ inputs.agent }}
        run: |
          if [ -z "$HINTERGLASS_KEY" ]; then echo "Missing identity key." >&2; exit 1; fi
          printf '::add-mask::%s\n' "$HINTERGLASS_KEY"
          name="$(hglab persona secret-name --agent "$AGENT")"
          printf '%s=%s\n' "$name" "$HINTERGLASS_KEY" >> "$GITHUB_ENV"
          if [ -n "$ANTHROPIC_KEY" ]; then printf '::add-mask::%s\n' "$ANTHROPIC_KEY"; printf 'ANTHROPIC_API_KEY=%s\n' "$ANTHROPIC_KEY" >> "$GITHUB_ENV"; fi
          if [ -n "$OPENAI_KEY" ]; then printf '::add-mask::%s\n' "$OPENAI_KEY"; printf 'OPENAI_API_KEY=%s\n' "$OPENAI_KEY" >> "$GITHUB_ENV"; fi
      - name: Keepalive (observe, verify if challenged, record presence)
        env:
          AGENT: ${{ inputs.agent }}
        run: hglab keepalive --agent "$AGENT" --scheduled
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: keepalive-${{ inputs.agent }}-${{ github.run_id }}
          path: runs/
          retention-days: 7
          if-no-files-found: ignore

  tick:
    if: needs.gate.outputs.run == 'true' && inputs.job == 'tick'
    needs: [gate, keepalive]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install .
      - name: Mask and export keys
        env:
          HINTERGLASS_KEY: ${{ secrets.hg_key }}
          ANTHROPIC_KEY: ${{ secrets.anthropic_api_key }}
          OPENAI_KEY: ${{ secrets.openai_api_key }}
          AGENT: ${{ inputs.agent }}
        run: |
          if [ -z "$HINTERGLASS_KEY" ]; then echo "Missing identity key." >&2; exit 1; fi
          printf '::add-mask::%s\n' "$HINTERGLASS_KEY"
          name="$(hglab persona secret-name --agent "$AGENT")"
          printf '%s=%s\n' "$name" "$HINTERGLASS_KEY" >> "$GITHUB_ENV"
          if [ -n "$ANTHROPIC_KEY" ]; then printf '::add-mask::%s\n' "$ANTHROPIC_KEY"; printf 'ANTHROPIC_API_KEY=%s\n' "$ANTHROPIC_KEY" >> "$GITHUB_ENV"; fi
          if [ -n "$OPENAI_KEY" ]; then printf '::add-mask::%s\n' "$OPENAI_KEY"; printf 'OPENAI_API_KEY=%s\n' "$OPENAI_KEY" >> "$GITHUB_ENV"; fi
      - name: Pull prior reports (run records feed influence signals)
        run: hglab reports pull || echo "no reports branch yet"
      - name: Blueprint ledgers from what stands in the world
        run: hglab factory reconcile || echo "ledgers not reconciled"
      - name: Persona wake
        env:
          AGENT: ${{ inputs.agent }}
          DRY_RUN: ${{ inputs.dry_run }}
          PYTHONUNBUFFERED: "1"
          JITTER: ${{ github.event_name == 'workflow_dispatch' && '0' || inputs.jitter_minutes }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            hglab tick --agent "$AGENT" --dry-run --jitter-minutes "$JITTER" --scheduled
          else
            hglab tick --agent "$AGENT" --jitter-minutes "$JITTER" --scheduled
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: run-record-${{ inputs.agent }}-${{ github.run_id }}
          path: runs/
          retention-days: 7
          if-no-files-found: ignore
      - name: Publish redacted run record to the reports branch
        if: always()
        env:
          AGENT: ${{ inputs.agent }}
        run: bash scripts/publish_reports.sh runs "$AGENT"

  shift:
    needs: gate
    if: needs.gate.outputs.run == 'true' && inputs.job == 'shift'
    runs-on: ubuntu-latest
    timeout-minutes: 70  # Plumbline's shift is 50 minutes, the hands' 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install .
      - name: Mask and export keys (the model key only serves the one closing line)
        env:
          HINTERGLASS_KEY: ${{ secrets.hg_key }}
          ANTHROPIC_KEY: ${{ secrets.anthropic_api_key }}
          OPENAI_KEY: ${{ secrets.openai_api_key }}
          AGENT: ${{ inputs.agent }}
        run: |
          if [ -z "$HINTERGLASS_KEY" ]; then echo "Missing identity key." >&2; exit 1; fi
          printf '::add-mask::%s\n' "$HINTERGLASS_KEY"
          name="$(hglab persona secret-name --agent "$AGENT")"
          printf '%s=%s\n' "$name" "$HINTERGLASS_KEY" >> "$GITHUB_ENV"
          if [ -n "$ANTHROPIC_KEY" ]; then printf '::add-mask::%s\n' "$ANTHROPIC_KEY"; printf 'ANTHROPIC_API_KEY=%s\n' "$ANTHROPIC_KEY" >> "$GITHUB_ENV"; fi
          if [ -n "$OPENAI_KEY" ]; then printf '::add-mask::%s\n' "$OPENAI_KEY"; printf 'OPENAI_API_KEY=%s\n' "$OPENAI_KEY" >> "$GITHUB_ENV"; fi
      - name: Pull prior reports (the spend so far today, for the budget caps)
        run: hglab reports pull || echo "no reports branch yet"
      - name: Blueprint ledgers from what stands in the world
        run: hglab factory reconcile || echo "ledgers not reconciled"
      - name: Work shift (build, gather, deposit, migrate)
        env:
          AGENT: ${{ inputs.agent }}
          PYTHONUNBUFFERED: "1"
        run: hglab shift --agent "$AGENT" --scheduled
      - name: Collector round (requests as goals, themes as factions; a no-op without duties)
        if: always()
        env:
          AGENT: ${{ inputs.agent }}
          PYTHONUNBUFFERED: "1"
        run: hglab crier round --agent "$AGENT" --scheduled
      - name: Land office round (survey, registry, offers; a no-op without duties)
        if: always()
        env:
          AGENT: ${{ inputs.agent }}
          PYTHONUNBUFFERED: "1"
        run: hglab land round --agent "$AGENT" --scheduled
      - name: Publish compact run records
        if: always()
        env:
          AGENT: ${{ inputs.agent }}
        run: bash scripts/publish_reports.sh runs "$AGENT"

  pulse:
    needs: gate
    if: needs.gate.outputs.run == 'true' && inputs.job == 'pulse'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install .
      - name: Mask and export model keys (judge only; no identity key needed)
        env:
          ANTHROPIC_KEY: ${{ secrets.anthropic_api_key }}
          OPENAI_KEY: ${{ secrets.openai_api_key }}
        run: |
          if [ -n "$ANTHROPIC_KEY" ]; then printf '::add-mask::%s\n' "$ANTHROPIC_KEY"; printf 'ANTHROPIC_API_KEY=%s\n' "$ANTHROPIC_KEY" >> "$GITHUB_ENV"; fi
          if [ -n "$OPENAI_KEY" ]; then printf '::add-mask::%s\n' "$OPENAI_KEY"; printf 'OPENAI_API_KEY=%s\n' "$OPENAI_KEY" >> "$GITHUB_ENV"; fi
      - run: hglab reports pull || echo "no reports branch yet"
      - name: Recompute the Pulse from public events and redacted wakes
        env:
          AGENT: ${{ inputs.agent }}
        run: hglab pulse --agent "$AGENT" --fetch-public --judge
      - name: Prune run records older than 14 days
        run: hglab reports prune --days 14
      - name: Publish reports
        run: bash scripts/publish_reports.sh reports "${{ inputs.agent }}"
      - name: Summary
        env:
          AGENT: ${{ inputs.agent }}
        run: |
          {
            echo "### Pulse for $AGENT"
            if [ -f "reports/agents/$AGENT/pulse.md" ]; then sed -n '1,12p' "reports/agents/$AGENT/pulse.md"; else echo "no pulse written"; fi
          } >> "$GITHUB_STEP_SUMMARY"

  retro:
    needs: gate
    if: needs.gate.outputs.run == 'true' && inputs.job == 'retro'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install .
      - run: hglab reports pull || echo "no reports branch yet"
      - name: Weekly retrospective proposal
        env:
          AGENT: ${{ inputs.agent }}
        run: hglab retro --agent "$AGENT" --fetch-public
      - uses: peter-evans/create-pull-request@v8
        with:
          title: "Retro: ${{ inputs.agent }} ${{ github.run_started_at }}"
          branch: agents/retro-${{ inputs.agent }}
          commit-message: "Propose persona and metric changes for ${{ inputs.agent }}"
          body: "Weekly retrospective proposal for ${{ inputs.agent }}. Human review required; this workflow never merges."
          add-paths: |
            agents/${{ inputs.agent }}/RETRO.md
