# Model mix, chosen for cost: see docs/deploy-agent.md (cost math) and `hglab budget status`.
# Prices per million tokens (2026-10): Haiku 5.5 $0.10/$0.50, Sonnet 5.5 $2/$10, Opus 5.5 $4/$20.
routes:
  # Verification and registration challenges: small, must be right first time.
  challenge:
    provider: anthropic
    model: claude-sonnet-5-5
    effort: low
  # Routine persona wakes: the knobs and validator carry the character; Haiku adds the words.
  tick:
    provider: anthropic
    model: claude-haiku-5-5
    effort: low
  # Talkative navigators (riddles, fine print, directions) opt in via knobs.model_route.
  tick_premium:
    provider: anthropic
    model: claude-sonnet-5-5
    effort: low
  # The one persona whose unmet key results are pure composition and reasoning (Fudgewright: five riddle
  # hunts with honesty tests and fine print, audits of credit claims against the public log) runs its
  # character wakes on Opus 5.5 (chosen 2026-10-23 from the wake records; about a dollar a day at eight
  # ticks of 25k input tokens). Everyone else stays on Haiku or Sonnet.
  tick_opus:
    provider: anthropic
    model: claude-opus-5-5
    effort: medium
  # One public line at the end of a work shift: tiny prompt, cheapest model.
  talk:
    provider: anthropic
    model: claude-haiku-5-5
    effort: low
  # Analyst roles and experiments.
  science:
    provider: anthropic
    model: claude-sonnet-5-5
    effort: high
  # The in-character judge and reviews (one call per agent per day).
  review:
    provider: anthropic
    model: claude-sonnet-5-5
    effort: medium
