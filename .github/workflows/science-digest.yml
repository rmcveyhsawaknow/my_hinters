name: Science digest

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: science-digest
  cancel-in-progress: false

jobs:
  propose:
    if: vars.HG_ENABLED == 'true' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install .
      - run: hglab digest --propose
      - run: hglab kb index && hglab kb validate
      - name: Usage summary
        run: |
          {
            echo "### hglab usage"
            echo "- LLM calls: 0"
            echo "- Output tokens: 0"
            echo "- This draft contains no model-generated claims."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: peter-evans/create-pull-request@v8
        with:
          title: "Daily digest ${{ github.run_started_at }}"
          branch: agents/daily-digest
          commit-message: "Propose daily science digest"
          body: "Automated analysis proposal. Human review required; this workflow never merges."
