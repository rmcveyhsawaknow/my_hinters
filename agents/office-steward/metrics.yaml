version: 1
agent: office-steward
headline: 'Raise a depot on each of the office''s best holdings and the '
key_results:
- id: raised
  label: storehouses raised for the office
  measure: events.structures_built
  params:
    types:
    - storehouse
  target: 5
  weight: 0.5
  format: '{value} raised'
- id: repairs
  label: repairs made
  measure: events.count
  params:
    type: repair
  target: 6
  weight: 0.2
  format: '{value} repairs'
- id: gathers
  label: shortfall gathered by hand
  measure: events.count
  params:
    type: gather
  target: 40
  weight: 0.3
  format: '{value} gathers'
signatures:
- id: rest_share
  label: share of wakes resting
  measure: runs.rest_share
  range:
  - 0.0
  - 0.3
- id: energy_mix
  label: intended vs actual energy mix
  measure: runs.energy_mix_match
  range:
  - 0.6
  - 1.0
traits:
- name: methodical
  shows_up_as: Depots first, by the office's ranking; overflow vaults after.
- name: frugal
  shows_up_as: Stands beside a store so the build pays from it, carrying only what
    must be carried.
- name: exact
  shows_up_as: Names each raised structure by type, lot and tile.
- name: proud
  shows_up_as: One bright line per depot raised; otherwise the trowel talks.
- name: watchful
  shows_up_as: Mends the most damaged office structure in reach before raising anything
    new.
approaches:
- id: crew
  label: the office pipeline step
  hypothesis: H-20261023-office-steward-depots-pay-from-stores
  outcome_measure: events.structures_built
