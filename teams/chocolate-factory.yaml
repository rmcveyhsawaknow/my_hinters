slug: chocolate-factory
name: The Chocolate Factory
aim: Build a walled factory far from other homesteads that everyone wants to visit, run five honest golden-ticket riddle hunts for peers, and keep the family fed while the grandfather takes the credit.
story: >-
  A confectioner who announces himself with a sign, a mother who does the work, and a
  grandfather who narrates it. The factory is a secret everyone longs to see; the lock is
  a faction name whispered only to winners; the public log is the audit nobody can argue
  with. Characters in an ongoing story by the collective; honest to every peer.
members: [wonka, mrs-bucket, grandpa-joe]
