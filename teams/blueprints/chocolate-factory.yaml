# The Chocolate Factory, as blocks (the owner's brief of 2026-10-24): a complex, many-coloured factory over
# four plots bought from the land office (I08, J08, I09, J09: x 80-99, y 80-99), climbing from the works on
# the bay up the hill belt to the foot of the eastern peak, every building joined by the chocolate river.
#
# Read from the land survey of tick 67156 (`hglab factory survey`): the eastern massif's south face (rows
# 78-84, x 84-91) is the highest ground reachable from the works; the hill belt below it (rows 85-89) is
# thick with stone nodes and the mountain's ore nodes need open ground beside them; grass and sand run from
# row 87 down to the bay at row 99. The world shapes the rest: a tile is 4x4 cells and 16 levels tall (a
# door is four levels), a box is at most 256 cells within 2 tiles of its builder, no block stands on water
# or mountain, and a slab at level 0 or anything above level 5 closes no tile.
#
# Tiles are [x0, y0, x1, y1], inclusive. Colours: natural white grey black brown red orange yellow lime
# green teal cyan blue indigo purple pink tan. Materials: wood (wood), stone (stone), thatch (fiber), metal (ore).
name: The Chocolate Factory
team: chocolate-factory
plots: [I08, J08, I09, J09, K06, K07, K08, K09]  # the East Works on the K column since the owner's instruction of 2026-11-03
commute: true  # the owner, 2026-11-03: the East Works lie up to 38 tiles from the works; a builder far from every ready step carries the next one's material there
version: 2  # the level rebuild of 2026-10-25: surveyed plinths, windows facing out of their own walls (ledger chocolate-factory.v2)
foundation_block: [stone, grey]
story: >-
  A confectionery that climbs a mountain: a glass elevator of rainbow light pressed against the eastern
  peak, a peppermint lookout at the head of the east hillside, a fudge mill and a cocoa terrace on the
  hill belt, a candy hall with lemon-drop turrets mid-slope, and a packing hall on the bay behind a golden
  gate; a river of chocolate runs from the peak and the lookout past every door and pours into the bay.
sections:
  - id: elevator
    name: The Glass Elevator
    tiles: [89, 84, 90, 85]  # hills under the eastern peak; the mountain stands at (89-90, 83)
    sign: {x: 88, y: 85, text: "The Glass Elevator: a lift of coloured glass pressed against the peak, up past every band of light."}  # the owner, 2026-11-02: a sign beside every building
    foundation: [[0, 1], [4, 5]]  # plinth levels per tile, rows north to south (hglab factory level)
    clear: {by: loompa-mason, tiles: all}  # version 1 stepped with the slope: Toffeetrowel takes it down, his own blocks come out whole
